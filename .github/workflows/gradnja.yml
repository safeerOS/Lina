name: Gradnja Lina

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: openline/android

jobs:
  teste-in-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Testi (JVM, brez prave seje in brez skrivnosti)
        run: ./gradlew :protocol:test :podpis:test :seznanitev:test :samostojna:test --no-daemon --stacktrace
      - name: Gradnja APK (debug, nepodpisan)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Podpis APK s stalnim kljucem (posodobitve cez staro brez izgube podatkov)
        env:
          LINA_PODPIS_JKS: ${{ secrets.LINA_PODPIS_JKS }}
          LINA_PODPIS_GESLO: ${{ secrets.LINA_PODPIS_GESLO }}
        run: |
          set -euo pipefail
          # Brez stalnega kljuca gradnja PADE: APK s podpisom debug (drug odtis) se ne namesti cez Lino in ne sme v izdajo.
          if [ -z "${LINA_PODPIS_JKS}" ] || [ -z "${LINA_PODPIS_GESLO}" ]; then echo "::error::Stalni kljuc (LINA_PODPIS_JKS, LINA_PODPIS_GESLO) ni na voljo: gradnja ustavljena"; exit 1; fi
          # Javni odtis certifikata Line (ni skrivnost); vsak drug odtis ustavi gradnjo.
          PRICAKOVAN=166efb0a3c4afd12b036010eac681581d6821256ffb21565109074e52e8247bd
          KS="$RUNNER_TEMP/lina-podpis.jks"
          echo "${LINA_PODPIS_JKS}" | base64 -d > "$KS"
          AS="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -1)"
          shopt -s nullglob
          apki=(app/build/outputs/apk/debug/*.apk)
          [ ${#apki[@]} -gt 0 ] || { echo "::error::Ni APK za podpis"; rm -f "$KS"; exit 1; }
          for apk in "${apki[@]}"; do
            "$AS" sign --ks "$KS" --ks-key-alias lina --ks-pass env:LINA_PODPIS_GESLO --key-pass env:LINA_PODPIS_GESLO "$apk"
            odtis="$("$AS" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest:' | sed 's/.*digest: //' | tr -d ':' | tr 'A-F' 'a-f')"
            [ "$odtis" = "$PRICAKOVAN" ] || { echo "::error::Napacen odtis podpisa ($odtis) v $apk"; rm -f "$KS"; exit 1; }
            echo "Podpis OK: $apk"
          done
          rm -f "$KS"
      - name: Izid
        run: |
          mkdir -p ../../izid
          cp app/build/outputs/apk/debug/*.apk ../../izid/
          sha256sum ../../izid/*.apk | tee ../../izid/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: lina-apk-debug
          path: izid/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testna-porocila
          path: |
            openline/android/**/build/reports/tests/
            openline/android/**/build/test-results/
          retention-days: 14
