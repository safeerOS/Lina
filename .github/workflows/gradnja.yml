name: Gradnja Lina

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: openline/android

jobs:
  teste-in-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Testi (JVM, brez prave seje in brez skrivnosti)
        run: ./gradlew :protocol:test :podpis:test :seznanitev:test :samostojna:test --no-daemon --stacktrace
      - name: Gradnja APK (debug, nepodpisan)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Izid
        run: |
          mkdir -p ../../izid
          cp app/build/outputs/apk/debug/*.apk ../../izid/ || true
          sha256sum ../../izid/*.apk | tee ../../izid/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lina-apk-debug
          path: izid/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: testna-porocila
          path: |
            openline/android/**/build/reports/tests/
            openline/android/**/build/test-results/
          retention-days: 14
